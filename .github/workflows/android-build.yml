name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check repository
        run: |
          git status --short
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

      - name: Release configuration audit
        run: |
          echo "Checking Android release configuration..."

          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'applicationId = "com.wahidiyah.miladiyyah"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts

          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml

          echo "Release configuration audit passed."

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/wahidiyah-upload.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release keystore prepared successfully."

      - name: Verify signing inputs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "ERROR: KEYSTORE_FILE was not created."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          test -f "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing inputs verified."
          echo "Alias verified: $KEY_ALIAS"

      - name: Run unit tests
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test --stacktrace

      - name: Run Android Lint
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease --stacktrace

      - name: Build debug APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify build outputs
        run: |
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo "Release AAB:"
          echo "$RELEASE_AAB"

          echo "Build outputs verified."

      - name: Verify AAB signature
        run: |
          RELEASE_AAB="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"

          if [ -z "$RELEASE_AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          jarsigner -verify "$RELEASE_AAB"

          echo "AAB signature verification completed."

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wahidiyah-miladiyyah-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v7
        with:
          name: wahidiyah-miladiyyah-signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Final release gate
        run: |
          echo "=================================================="
          echo " RELEASE QUALITY GATE PASSED"
          echo "=================================================="
          echo "Target SDK : 36"
          echo "Version    : 1.0.0"
          echo "VersionCode: 1"
          echo "Signed AAB : VERIFIED"
          echo "Unit tests : PASSED"
          echo "Lint       : PASSED"
          echo "=================================================="
